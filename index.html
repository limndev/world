<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함께 걷는 자연 공간</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./vendor/phaser.min.js" defer></script>
    <script src="./vendor/supabase-js-2.45.4.umd.js" defer></script>
    <script src="./nature-config.js" defer></script>
    <script src="./placement-rules.js" defer></script>
    <script src="./art.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./app.js" defer></script>
    <script src="./placement.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">함께 걷고 발견하는 자연 탐험 공간</p>
          <h1>함께 걷는 자연 공간</h1>
          <p id="connection-status" role="status">입장 코드를 입력해 주세요.</p>
        </div>
      </header>

      <section id="join-card" class="setup-card" aria-labelledby="join-title">
        <h2 id="join-title">입장 코드를 입력해 주세요</h2>
        <p>선생님이 알려 준 8자리 코드를 적어요. 영어 대문자와 숫자로 되어 있어요.</p>
        <form id="join-form" autocomplete="off">
          <label>입장 코드
            <input id="join-code" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="12" placeholder="예: AC4D7K9M" aria-describedby="join-message">
          </label>
          <div class="button-row">
            <button id="join-button" type="submit">들어가기</button>
            <button id="dev-enter" type="button" class="secondary" hidden>시험 모드로 입장 (서버 없이)</button>
          </div>
        </form>
        <p id="join-message" aria-live="polite"></p>
      </section>

      <section id="world-section" class="world-layout" aria-labelledby="world-title" hidden>
        <div>
          <h2 id="world-title">자연 세계</h2>
          <div id="game" tabindex="0" role="application" aria-label="열린 초원, 연못과 물의 정원, 갈대밭, 작은 섬, 바람 드는 들판, 조용한 나무 그늘이 이어진 자연 공간 지도입니다. 방향키 또는 화면을 누른 채 이동할 수 있습니다."></div>
          <p class="controls">방향키로 걷거나 화면을 누른 채 걸어가세요. 자연물을 놓을 때는 방향키로 자리를 옮기고 Enter로 놓아요.</p>
          <p id="location-status" class="location-status" aria-live="polite">열린 초원: 넓은 풀밭에서 다른 탐험가와 천천히 걸어 볼 수 있어요.</p>
          <p id="realtime-note" class="realtime-note"></p>
        </div>
        <aside aria-label="함께 있는 친구와 자연물 놓기">
          <h2 id="people-title">함께 있는 친구</h2>
          <p id="presence-summary">아직 입장하지 않았어요.</p>
          <ul id="presence-list"></ul>
          <p id="world-state" class="world-state"></p>

          <section id="nature-panel" aria-labelledby="np-title" hidden>
            <h2 id="np-title">자연물 놓기</h2>
            <p id="np-note" class="np-note"></p>
            <div id="np-kinds" role="group" aria-label="놓을 자연물 고르기"></div>
            <div class="np-actions">
              <button id="np-confirm" type="button" hidden>여기에 놓기</button>
              <button id="np-cancel" type="button" class="secondary" hidden>취소</button>
            </div>
            <p id="np-status" role="status"></p>
            <p id="np-cooldown" class="np-cooldown"></p>
            <p id="np-count" class="np-count"></p>
            <h3>내가 놓은 자연물</h3>
            <ul id="np-list"></ul>
            <section id="np-selected" aria-labelledby="np-sel-title" hidden>
              <h3 id="np-sel-title">선택한 자연물</h3>
              <p id="np-sel-text"></p>
              <div class="np-actions">
                <button id="np-move" type="button">옮기기</button>
                <button id="np-delete" type="button" class="danger">지우기</button>
                <button id="np-deselect" type="button" class="secondary">선택 풀기</button>
              </div>
            </section>
          </section>
        </aside>
      </section>
    </main>
  </body>
</html>
